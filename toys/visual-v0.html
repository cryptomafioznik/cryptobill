<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#09091d">
  <title>CRYPTOBILL — Visual V0 Lab</title>
  <link rel="stylesheet" href="visual-v0/styles.css">
</head>
<body>
  <canvas id="scene" aria-label="CRYPTOBILL Visual V0 Canvas 2D"></canvas>
  <div class="lab-controls" aria-label="Переключатели визуального стенда">
    <div class="lab-row" role="group" aria-label="Вариант">
      <button data-variant="sideplus">A · SIDE 2D+</button>
      <button data-variant="perspective">B · PERSPECTIVE</button>
    </div>
    <div class="lab-row states" role="group" aria-label="Состояние">
      <button data-state="flat">РОВНО</button>
      <button data-state="climb">ПОДЪЁМ</button>
      <button data-state="air">ПРЫЖОК</button>
      <button data-state="compression">ПОСАДКА</button>
    </div>
  </div>
  <div id="assetStatus" aria-live="polite">Загрузка реальных ассетов…</div>
  <script type="module" src="visual-v0/app.js"></script>
</body>
</html>
